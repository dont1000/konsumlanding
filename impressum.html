<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Impressum – Konsum</title>
<style>
  :root{
    --bg:#fbfbf8; --surface:#fff; --ink:#1b211d; --ink-soft:#5a635c;
    --accent:#2f7d57; --line:#e7e8e2;
    --ph-bg:#fff3cd; --ph-ink:#6b5500; --note-bg:#fdf6ec; --note-line:#e7c98a;
    --measure:42rem;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px; line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--measure); margin:0 auto; padding:clamp(1.5rem,4vw,4rem) 1.25rem 5rem}
  header.doc{margin-bottom:2.5rem; padding-bottom:1.5rem; border-bottom:1px solid var(--line)}
  .eyebrow{font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 .6rem}
  h1{font-size:clamp(1.8rem,5vw,2.5rem); line-height:1.15; margin:0; letter-spacing:-.01em}
  h2{font-size:1.05rem; margin:2.2rem 0 .3rem; color:var(--accent)}
  p{margin:.5rem 0}
  a{color:var(--accent); text-underline-offset:2px}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:3px}
  .ph{background:var(--ph-bg); color:var(--ph-ink); padding:.05em .35em; border-radius:4px; font-weight:600; font-size:.95em}
  .note{background:var(--note-bg); border:1px dashed var(--note-line); color:#7a5c1f; border-radius:8px; padding:.7rem .9rem; font-size:.9rem; margin:1rem 0}
  .note strong{color:#6b5000}
  footer.doc{margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); color:var(--ink-soft); font-size:.92rem}
  footer.doc a{font-weight:600}
  @media print{ .note{display:none} body{background:#fff} }
</style>
</head>
<body>
<div class="wrap">

  <header class="doc">
    <p class="eyebrow">Konsum</p>
    <h1>Impressum</h1>
  </header>


  <h2>Angaben gemäß § 5 Digitale-Dienste-Gesetz (DDG)</h2>
  <p>
    Ralf Braitling<br>
    Herrmann-Oberth-Str 8<br>
    85640 München<br>
    Deutschland
  </p>

  <h2>Kontakt</h2>
  <p>
    E-Mail: konsumapp@braitling.de<br>
  </p>

  <h2>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h2>
  <p>Ralf Braitling, Anschrift wie oben</p>




  <footer class="doc">
    <p>Siehe auch: <a href="datenschutz.html">Datenschutzerklärung</a></p>
  </footer>

</div>
</body>
</html>
